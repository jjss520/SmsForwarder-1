name: Weekly Build

# 触发器：手动触发
on:
  workflow_dispatch:
    inputs:
      root_sol:
        description: "Build Title"
        required: true
        default: "SmsForwarder"

# ⚠️ 关键：赋予写权限，否则无法创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      output: "${{ github.workspace }}/build/app/outputs/apk/release"
    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4
      
      # 2. 删除旧的工作流记录 (保持页面整洁)
      - name: Delete Old Workflows
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_pattern: 'Weekly Build'
          
      # 3. 设置 JDK 11
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk
          
      # 4. 获取打包秘钥 (注意仓库地址)
      - name: Checkout Android Keystore
        uses: actions/checkout@v4
        with:
          repository: jjss520/keystore   # ⚠️ 确认这是你的私有仓库
          token: ${{ secrets.TOKEN }}
          path: keystore
          
      # 5. 开始编译
      - name: Build with Gradle
        run: bash ./gradlew assembleRelease
      
      # 6. ✅ 修改点：强制固定版本号 (不再自动解析)
      - name: Set Fixed Version Info
        run: |
          # 这里直接写入你指定的版本号
          echo "ver_name=3.3.3.260122" >> $GITHUB_ENV
          echo "ver_code=100054" >> $GITHUB_ENV
          
          echo "✅ 版本已锁定: v3.3.3.260122 (Build 100054)"

      # 7. 发布到 GitHub Releases 🚀
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # Tag 将会被命名为: v3.3.3.260122_100054
          tag_name: v${{ env.ver_name }}_${{ env.ver_code }}
          name: SmsForwarder v${{ env.ver_name }} (Build ${{ env.ver_code }})
          body: |
            自动化编译构建
            - 新增 打开软件密码功能
            - 编译时间: ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          # 使用通配符上传所有 APK (无论 Gradle 生成的文件名是什么，都上传)
          files: ${{ env.output }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }} 

      # 8. (可选) 依然保留 Artifacts 备份
      - name: Upload Artifacts Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "SmsForwarder_v${{ env.ver_name }}_All_APKs"
          path: "${{ env.output }}/*.apk"
